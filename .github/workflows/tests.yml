name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax and import check
        run: PYTHONPATH=src python -m compileall src tests

      - name: Tests with coverage
        run: PYTHONPATH=src python -m coverage run -m unittest discover -s tests

      # fail_under = 80 lives in pyproject.toml, so this step fails the build
      # whenever line coverage drops below the agreed gate.
      - name: Coverage gate (>= 80%)
        run: PYTHONPATH=src python -m coverage report
